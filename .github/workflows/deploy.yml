name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - run: npm ci

      - name: Fetch prebuilt external disks (ELKS)
        run: npm run os:fetch

      - name: Build 7OS and the site
        run: npm run build

      - name: Boot 7OS headlessly
        run: npm run test:os

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: almo7aya.dev
